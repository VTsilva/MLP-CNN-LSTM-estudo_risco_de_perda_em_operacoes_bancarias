name: Neural architecture integration smoke test

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

jobs:
  tensorflow-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install TensorFlow and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "tensorflow==2.22.0rc0" "numpy==2.5.0" "pandas==3.1.1" "nbformat==5.10.4"
      - name: Build, train once and predict with all 16 architectures
        run: python tools/test_neural_integration.py
